# Nginx configuration for the ServerWatch Community Edition container.
#
# Serves the pre-built dashboard from /usr/share/nginx/html and proxies the API
# and health probes to the Go backend on loopback. Security headers mirror
# server/internal/http/security.go and deployments/nginx/serverwatch.conf.

limit_req_zone $binary_remote_addr zone=serverwatch_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=serverwatch_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8080/ready;
        access_log off;
    }

    # Public status page and Prometheus metrics are opt-in on the backend. They
    # are proxied unconditionally here; the backend returns 404 when disabled,
    # and /metrics is meant to be kept off the public network.
    location = /status {
        proxy_pass http://127.0.0.1:8080/status;
    }

    location = /status.css {
        proxy_pass http://127.0.0.1:8080/status.css;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:8080/metrics;
    }
}
