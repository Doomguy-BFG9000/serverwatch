name: Bug report
description: Report a problem with ServerWatch Community Edition
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, tokens, or private
        hostnames. For security issues, follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: The value of GET /health (or the dashboard header).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and hostnames before pasting.
      render: shell
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, deployment method (release bundle/systemd/Docker Compose), database.
      placeholder: "Ubuntu 24.04, systemd, Postgres 16"
    validations:
      required: false
